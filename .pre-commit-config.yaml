# See https://pre-commit.com for more information

# Fixtures contain deliberate errors for tests/test_tools.py. Submodules in
# ext/ are not ours; ext/README.md is.
exclude: ^(ext/[^/]+/|tests/fixtures/)

repos:
  # --- COMMON/GENERAL HOOKS ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace      # Remove unnecessary whitespaces
      - id: end-of-file-fixer        # Ensure files end with a newline
      - id: check-yaml               # Validate YAML syntax
      - id: check-added-large-files  # Prevent bumping the repo size with huge files
      - id: check-merge-conflict     # Check for unresolved merge conflicts

  # --- BASH (Shell Scripts) ---
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck               # Static analysis for shell scripts
        files: ^(activate|setup/.*\.sh)$
        types: [file]                # activate is sourced, not executable

  # --- PYTHON (Ruff) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff                     # Fast Python linter & import sorter
        args: [ --fix ]
      - id: ruff-format              # Fast Python formatter (Black-compatible)

  # --- MARKDOWN & DOCS ---
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier                 # Format Markdown
        types: [markdown]
        args: [ --prose-wrap, always, --print-width, "80" ]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint             # Linter for Markdown style and consistency
        args: [ --fix ]

  # The venv from ./activate holds requirements.txt; the git hook may run
  # without it being active.
  - repo: local
    hooks:
      - id: cogload                  # Cognitive load limits, see tools/cogload.py
        name: cogload
        entry: .venv/bin/python3 tools/cogload.py
        language: system
        types: [markdown]
        # Glossary changes can break any file, so always check all of them.
        pass_filenames: false
        args: [ README.md, AGENTS.md, TODO.md, ext/README.md, docs/, players/, ideas/ ]

      - id: links                    # Links and source citations resolve
        name: links
        entry: .venv/bin/python3 tools/links.py
        language: system
        types: [markdown]
        pass_filenames: false
        args: [ README.md, AGENTS.md, TODO.md, ext/README.md, docs/, players/, ideas/ ]

      - id: cards                    # Player card structure, see docs/card-template.md
        name: cards
        entry: .venv/bin/python3 tools/cards.py
        language: system
        types: [markdown]
        pass_filenames: false
        args: [ players/ ]

      # Fields at columns 8, 16 and 32, spaces only; a field past its column
      # gets one space. Options: .m68k-format.json.
      - id: asmfmt                   # 68k assembler layout
        name: asmfmt
        entry: m68k-format --write
        language: node
        # The formatter needs Node 22.15.1 or later; the CI image's is older.
        language_version: 24.14.0
        additional_dependencies: [ m68k-formatter@0.3.0 ]
        files: \.asm$

      - id: glossary                 # docs/glossary.md matches data/glossary.yaml
        name: glossary
        entry: .venv/bin/python3 tools/glossary.py --check
        language: system
        pass_filenames: false
        always_run: true

      - id: techniques               # Seen-in lists of docs/paula-techniques.md match the cards
        name: techniques
        entry: .venv/bin/python3 tools/techniques.py --check
        language: system
        pass_filenames: false
        always_run: true

      - id: annot                    # data/annot/*.yaml match their sources
        name: annot
        entry: .venv/bin/python3 tools/annot.py --check
        language: system
        pass_filenames: false
        always_run: true

      - id: specs                    # specs/ type-check; names are labels
        name: specs
        entry: .venv/bin/python3 tools/specs.py
        language: system
        pass_filenames: false
        always_run: true             # annotations and players.yaml matter too

      - id: mypy                     # tools/ type-check; not yet --strict
        name: mypy
        entry: .venv/bin/python3 -m mypy --check-untyped-defs --cache-dir build/mypy-tools tools/
        language: system
        files: ^tools/.*\.py$
        pass_filenames: false

      - id: players                  # data/players.yaml is valid
        name: players
        entry: .venv/bin/python3 tools/players.py --check
        language: system
        pass_filenames: false
        always_run: true

      - id: pages                    # Each card fits its printed pages, see tools/print.py
        name: pages
        entry: .venv/bin/python3 tools/print.py --check players/
        language: system
        files: ^(players/.*\.md|tools/print\.py)$
        pass_filenames: false

      - id: reviews                  # data/reviews/*.yaml are valid; staleness passes
        name: reviews
        entry: .venv/bin/python3 tools/reviews.py --check
        language: system
        files: ^(data/reviews/.*\.yaml|players/.*\.md|tools/reviews\.py)$
        pass_filenames: false

      - id: tests                    # Checker self-tests and spec tests
        name: tests
        entry: .venv/bin/python3 -m unittest discover -s tests
        language: system
        pass_filenames: false
        always_run: true
