name: Checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  checks:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # links and cards read the sources in ext/.
          submodules: true
          # No hook reads data/module/; disasm.py runs locally. So the Git LFS
          # files stay pointers here.
          lfs: false
      - name: Cache hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run all hooks
        # Formatters fail here instead of fixing files; the diff shows why.
        shell: bash
        run: |
          . ./activate
          pre-commit run --all-files --show-diff-on-failure
