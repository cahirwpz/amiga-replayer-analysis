comments:
  647: "'Synthesis' instrument file, 502 bytes"
  651: plus 64 filtered waves of 128 bytes
  2047: tick length, used to scale rates
  2078: "$ffff: end of track"
  2081: "$c000 and above: wait N ticks"
  2087: "below $80: note number, then velocity"
  2088: "$80 instrument, $81 volume, $82 tempo, $83 pitch bend"
  2199: "pitch bend for this track"
  1600: "track pitch bend: one of 64 period factors, x1.52 to x0.67"
  4748: "TINY: release the note after 3/4 of its length"
  6543: "SMUS: $82 time signature"
  6556: "SMUS: $84 track volume"
  6960: "SMUS: release the note after 3/4 of its length"
  2151: velocity 0 releases the note
  2169: velocity scales the volume
  2226: the instrument type's tick routine
  2257: the instrument type's register routine
  2539: "note state 2: release"
  2548: LFO rate scaled by tick length
  2581: envelope rate scaled by tick length
  2691: two buffers per voice, used in turn
  2876: feedback per sample, about 0.9

banners:
  4631: |
    PlayTINY: TINY scores. A note event carries a length, not a velocity.
    $80 is a rest, $81 changes instrument.
  6528: |
    SMUS loader: turn EA duration codes into ticks. A whole note is 32
    ticks; a dotted note is 1.5 times longer.
  2213: |
    TickInstruments: every instrument type is a small driver with two
    entry points: tick, then write Paula registers.
  2455: |
    SynthTick: pitch with portamento, LFO, envelope, then the wave.
    Instrument offsets: $24 wave (128 bytes), $a4 LFO table (256 bytes),
    $1ac volume, $1ae envelope to volume, $1b0 LFO to volume,
    $1b2 portamento time, $1b4 LFO to pitch, $1b6 filter base,
    $1b8 envelope to filter, $1ba LFO to filter, $1bc LFO rate,
    $1be LFO mode, $1c0 LFO delay, $1c2 wave mode rate, $1c4 stretch depth,
    $1c6 four envelope levels, $1ce four envelope rates.
  2568: |
    Envelope: stages 0 attack, 2 decay, 4 sustain, 6 release.
    Each stage moves the level towards its target at its rate.
  2665: |
    SelectFilter: filter index = base - envelope * amount + LFO * amount.
    The index picks one of 64 filtered copies of the wave.
  2712: |
    Wave modes: BlendCopy averages the wave with a copy read at a moving
    offset. StretchHalves plays one half faster and the other slower.
  2866: |
    OneFilter: run a resonant low-pass filter over the 128-byte wave,
    once for each of 64 cutoffs.
