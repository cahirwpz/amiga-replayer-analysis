comments:
  729: "LOOP_POSITIONS: loop this voice's positions; STOP_VOICE: stop the voice"
  772: events from FIRST_MODIFIER only modify; the loop reads on
  795: the delay is over; switch to the other volume table
  804: the delay is over; switch to the other fine pitch table
  835: minus the note's and the position's volume offsets
  902: plus the position's transpose
  995: lower the edge sample, between high and low
  1726: the position can swap this instrument for another
  1819: slide rate chosen so the glide fills the note

banners:
  716: |
    VoiceTick: each voice has its own positions and events.
    A position is 12 bytes: pattern, transpose, repeat count, instrument
    swap (from, to), volume offset.
  764: |
    ReadEvent: an event is a word opcode and its arguments.
    Most events carry a length in ticks, and some of: note, volume,
    instrument, glide.
  809: |
    Four table walkers, one step per tick: volume, note offset,
    fine pitch, pulse wave. A table is a list of runs:
    count, repeat, then `count` values. TABLE_END restarts the table.
  957: |
    PulseWalker: a value picks width W of 16 and an amount A. Copy the
    16-byte pulse wave with W low samples, then lower sample W by A.
  1638: |
    EventTable: 24 events. Opcodes below FIRST_MODIFIER combine length,
    note, volume and instrument. From FIRST_MODIFIER: legato on/off,
    table switches, slides.
  2378: |
    PulseWaves: 16 pulse waves of 16 bytes; wave W has W low samples.

# Classes in specs/synth_dream.py: each word occurs in the source.
