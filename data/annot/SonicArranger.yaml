comments:
  1785: "$80: no new note, hold"
  1787: "$7f: note off"
  1797: flag bit 2 skips the note transpose
  1804: flag bit 3 skips the instrument transpose
  1906: Paula plays the voice's own copy of the wave
  2039: one of three arpeggio tables, chosen by the pattern entry
  2124: vibrato depth divides the table value
  2214: rows marked $80 hold the ADSR at its sustain point
  2217: sustain point
  2242: ADSR ended on 0 and does not repeat; the voice falls silent
  2749: the low byte of the video beam position serves as noise
  2761: noise again, from the beam position

banners:
  1432: |
    Play: runs once per tick. Every `speed` ticks it reads a row.
  1772: |
    ReadVoiceRow: pattern entry, 4 bytes: note, instrument, flags and command, argument.
    Flags: two bits pick an arpeggio table, two bits skip transposes.
  1929: |
    SetInstrument: instrument record, 152 bytes. Offsets used here:
      $00 synth flag       $02 wave or sample     $04 length
      $10 volume           $12 fine tune          $14 portamento speed
      $16 vibrato delay    $18 vibrato speed      $1a vibrato depth
      $1c AMF table        $1e AMF delay          $20 AMF length   $22 repeat
      $24 ADSR table       $26 ADSR delay         $28 ADSR length  $2a repeat
      $2c sustain point    $2e sustain delay
      $40 effect argument  $42 effect number      $44 start        $46 end
      $48 effect delay     $4a three arpeggio tables, 16 bytes each
    Waves, AMF and ADSR tables are 128 bytes each, in three pools.
  2012: |
    VoiceTick: arpeggio, portamento, vibrato, AMF, then the wave effect,
    then ADSR.
  2289: |
    Wave effects 1-17 rewrite the voice's copy of the wave, every
    `effect delay` ticks. Most work on bytes `start` to `end`.
    `EffectStep` moves the effect position from `start` to `end`, then
    back to `start`.
