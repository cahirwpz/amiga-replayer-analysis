banners:
  87: |
    Voices 0 and 3 are left, 1 and 2 right. Picking: the channel's side
    first, the other side if its voices are freer. Between two voices,
    the lower envelope state wins; a round-robin breaks ties. A voice
    with a higher priority or a blocking sound is skipped.
