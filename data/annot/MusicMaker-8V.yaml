banners:
  2845: |-
    Mixes voice pairs 7+6, 5+4, 3+2 and 1+0 into channels 3 to 0. The
    channel plays at the higher voice's period; the other voice is
    resampled. The louder voice sets the channel volume; the quieter one
    is scaled by a table.

