comments:
  1740: "position entry, per voice: pattern, transpose, instrument transpose, flags"
  1746: "$Fx: volume offset for this voice"
  1753: "$Ex: speed for all voices"
  1796: "note bit 7: keep the instrument's lists running"
  568: "4-sample square: -78, -78, 77, 77"
  1288: "mixer register 7; a 0 bit enables tone or noise"
  1306: chip channel B plays on Paula channel 3
  1333: Paula channel 1 plays digital samples and the SID pulse
  1377: the SID pulse takes channel A's volume
  1411: "16: the chip's envelope mode, not emulated; fixed 32"
  1414: 16 log volume steps to Paula's linear 0-64
  1418: "chip period x 7 + 1: 4 samples per cycle"
  1423: tone wins when tone and noise are both on
  1648: SID period, scaled like a tone period
  2046: start a digital sample on Paula channel 1

banners:
  1286: |
    EmuTick: once per tick, after the ST player has run.
    Read the chip register shadow and set Paula channels 0, 3, 2 for
    chip channels A, B, C. Per channel: tone, noise or silence.
  2531: |
    RegisterShadow: one long per chip register, value in byte 2.
    The ST player writes here instead of to the YM2149.

