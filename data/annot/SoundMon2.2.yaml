comments:
  132: "'V.3' in the header: the module has a table pool"
  155: a pattern is 16 rows of 3 bytes
  159: the table pool follows the patterns
  162: each table is 64 bytes
  180: arpeggio cycles over 4 ticks
  185: vibrato step, shared by all voices
  201: vibrato depth divides the table value
  215: step 0 adds the high nibbles
  228: step 1 adds the low nibbles
  239: steps 2 and 3 play the base note
  245: synth walkers run every tick
  262: bit 15 of the period flags a new note
  268: write the saved 32 bytes back into the wave
  311: instrument transpose for this voice
  312: note transpose for this voice
  334: "NO_TRANSPOSE: argument high nibble set -> no note transpose"
  347: the three legato commands change the note without a restart
  410: filter off
  413: filter on
  435: jump to this position after the row
  446: select the wave effect (0-6)
  456: LEGATO_FLIP flips bit 0 of the effect number
  458: LEGATO_KEEP_ADSR keeps the ADSR walker running
  504: "SYNTH in the first name byte: synth instrument"
  564: waves and control tables share one pool
  580: ADSR table values are signed; centre them to 0..255
  589: volume scaled by the table value (0..63)
  599: EG, MOD or an effect will change the wave
  607: remember which wave was saved
  608: save the first 32 bytes of the wave
  654: signed table value -> 0..255
  681: signed pitch offset
  688: LFO depth divides the table value
  719: the EG walker changes the wave in place
  721: table value -> sample count 0..31
  737: restore samples from the saved copy
  745: negate samples of the saved copy
  765: effects touch only the first 32 bytes
  766: the byte before the wave, i.e. the previous table's last byte
  785: saved copy, read backward
  803: saved copy, read forward
  822: next table in the pool
  840: saved copy, same as MorphToSaved
  864: copy the next table over the wave
  881: byte 32 of the wave, outside the saved 32 bytes
  895: one record per voice, see the banner

banners:
  128: |
    InitSong: find the table pool and the sample addresses.
  179: |
    PlayTick: runs once per tick.
    Updates periods, vibrato and arpeggio; runs the synth walkers.
    Every `Speed` ticks it reads a row.
  261: |
    Restore the waves that the previous notes changed.
  295: |
    ReadRow: read one row for each voice.
    A row entry is 3 bytes: note; instrument (high nibble) and option
    (low nibble); option argument.
  383: |
    Options: the low nibble of the second byte.
    0 arpeggio, 1 volume, 2 speed, 3 filter, 4 slide up, 5 slide down,
    6 vibrato, 7 jump, 8 auto slide, 9 auto arpeggio, 10 transposes off,
    11 effect, 13-15 auto arpeggio without a restart.
  496: |
    StartNote: start the note on this voice's audio channel.
    Sample instruments play from memory; synth instruments play a wave.
  544: |
    StartSynthNote: set up the four walkers and the effect.
    Synth instrument, 32 bytes:
       0 $ff (synth)         1 wave table        2 wave length (words)
       4 ADSR control        5 ADSR table        6 ADSR length   8 ADSR speed
       9 LFO control        10 LFO table        11 LFO depth
      12 LFO length         14 LFO delay        15 LFO speed
      16 EG control         17 EG table         18 EG length
      20 EG delay           21 EG speed
      22 effect             23 effect speed     24 effect delay
      25 MOD control        26 MOD table        27 MOD speed
      28 MOD delay          29 volume           30 MOD length
    Control: 0 off, 1 once, other values loop.
  622: |
    RunWalkers: once per tick, for each synth voice.
    Order: ADSR (volume), LFO (period), EG (wave), effect (wave), MOD (wave).
    Each walker waits `speed` ticks, then reads one table value.
  701: |
    EgWalker: the table value N sets how many leading samples are negated.
    It works on the difference between the old and the new N.
  757: |
    Wave effects: see WaveEffect. Each changes the first 32 bytes of the wave.
  867: |
    ModWalker: write one table value into the wave.
  894: |
    Voice record, one per voice: see `layouts: Voice` in
    data/annot/SoundMon2.2.yaml.

# Classes in specs/soundmon_22.py: each word occurs in the source.
types:
  Score: [bpsong]
  Instrument: [samples]
  SynthInstrument: [bpplaysynthetic]
  WalkerSetup: [bpplaysynthetic]
  Walker: [bpsynth]
  SavedWave: [bpbuffer]
  Voice: [bpcurrent]
  Module: [bpstep, bpdelay, arpcount]

# Records of specs/soundmon_22.py: size in bytes, then field: [offset, size].
# Field names are the spec's; a walker's are WALKER.pos, .counter, .mode.
layouts:
  Voice:
    size: 36
    fields:
      period: [0, w] # bit 15: new_note
      volume: [2, b]
      instrument: [3, b]
      start: [4, l]
      length: [8, w]
      note: [10, b]
      arpeggio: [11, b]
      auto_slide: [12, b]
      auto_arpeggio: [13, b]
      eg.pos: [14, w]
      lfo.pos: [16, w]
      adsr.pos: [18, w]
      mod.pos: [20, w]
      eg.counter: [22, b]
      lfo.counter: [23, b]
      adsr.counter: [24, b]
      mod.counter: [25, b]
      effect_delay: [26, b]
      synth: [27, b]
      eg_value: [28, b]
      eg.mode: [29, b]
      lfo.mode: [30, b]
      adsr.mode: [31, b]
      mod.mode: [32, b]
      vibrato: [34, b]
      effect: [35, b]
  SavedWave:
    size: 36
    fields:
      address: [0, l]
  Instrument:
    size: 32
    fields:
      length: [24, w]
      repeat_start: [26, w]
      repeat_length: [28, w]
      volume: [30, w]
