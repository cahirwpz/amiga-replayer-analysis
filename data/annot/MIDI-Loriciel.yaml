comments:
  443: PPQ times 10000, not tempo; tempo arrives in META_TEMPO
  519: all unrecognised events skip two bytes, regardless of their real length
  727: one tick advances every active track by four pulses
  752: keep negative timing residue, but a positive delta always ends this visit
  923: sixteen track records of twenty bytes; no count bounds check
  1060: first zone whose upper note bound includes the note
  1065: zone byte 4 is the note offset used for the period lookup
  1224: allocated voices get a silent reload, even if their sample has already ended
  1300: every MIDI channel starts with bank program zero
  1345: with no free voice, the last matching MIDI channel wins; fallback voice zero
  1357: only the latest allocated voice remains reachable by this MIDI channel
  1372: no search for older overlapping notes

