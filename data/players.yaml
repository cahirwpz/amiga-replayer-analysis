# Hand-written facts per player. Keys are binary names in ext/uade/players.
# tools/players.py checks this file.
# tools/inventory.py reads `source`, `replay` and `note` from here.
#
# Fields, all optional:
#   source            source path when automatic matching fails. `ext/...` is
#                     relative to the repo root, the rest to
#                     ext/uade/amigasrc/players.
#   replay            replay location when the heuristic in inventory.py is wrong.
#   note              remark in the output of tools/inventory.py.
#   provenance        where the code we read comes from; values in the glossary.
#   provenance_guess  true when provenance is a guess.
#   author, year, game
#   family            lineage name. Members grow from each other.
#   after             {player, evidence, why, cite}: the version this one grew
#                     from. Evidence values are in the glossary.
#   head              true for the version that carries the family's card.
#   distinct          the idea that earns this version its own card.
#   influences        [{player or name, evidence, link}]: older programs it
#                     built on, with no shared code that we know of.
#   ports             other code for the same player under ext/, e.g. to
#                     cross-check. `source` already counts; do not repeat it.
#   related           other players worth comparing.
#   links             first-hand pages, e.g. by the author.

