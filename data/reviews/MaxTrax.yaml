  open:
  - section: Key ideas
    quote: 'Enables: songs from a MIDI sequencer play almost unchanged.'
    rule: guess
    fix: 'Mark it "(guess)": no replay code shows how a Music-X export maps.'
  - section: Key ideas
    quote: 'An instrument is a multisample: one sample per octave.'
    rule: one-claim
    fix: An instrument is a multisample. It has one sample per octave.
  - section: Key ideas
    quote: 'Pitch adds up as a logarithm: note, pitch bend, portamento and tuning.'
    rule: one-claim
    fix: Pitch adds up as a logarithm. It sums the note, pitch bend, portamento and
      tuning.
  - section: Key ideas
    quote: 'A note is two audio.device requests: the attack part once, then the sustain
      part looped.'
    rule: one-claim
    fix: A note is two audio.device requests. The attack part plays once. The sustain
      part loops.
  - section: Composer's view
    quote: 'An event: command, data, start delta, stop time.'
    rule: one-fact
    fix: One row per field, each citing `:Event`.
  - section: Composer's view
    quote: 'A note: MIDI channel, velocity in 16 steps, length.'
    rule: one-fact
    fix: One row per field, each citing `:RunEvent`.
  - section: Composer's view
    quote: A glide needs mono mode and CC 65.
    rule: label-claim
    fix: 'Cite `:NoteOn`: it checks mono mode and CC 65 before `MonoLegato` runs.'
  - section: Composer's view
    quote: A repeat is a begin and an end event, 4 levels deep.
    rule: one-fact
    fix: 'Two rows: a begin and an end event; 4 levels deep.'
  - section: What is unique
    quote: 'Pan picks a side, not a level: the left or the right voices.'
    rule: one-claim
    fix: Pan picks a side, not a level. A note plays on the left or the right voices.
  - section: What is unique
    quote: 'Of two voices on one side, the freer one wins: free, then releasing, then
      held.'
    rule: one-claim
    fix: Of two voices on one side, the freer one wins. Free beats releasing, and
      releasing beats held.
  - section: What is unique
    quote: 'Priority: score 0, game notes 1, game sounds 2.'
    rule: one-claim
    fix: Game sounds rank above game notes. Game notes rank above the score.
  - section: What is unique
    quote: 'A slide to a slower tempo overshoots high until it ends: a bug.'
    rule: one-claim
    fix: A slide to a slower tempo overshoots high until it ends. This is a bug.
  - section: What is unique
    quote: 'A new pitch bend range, with the wheel below center, bends up: a bug.'
    rule: one-claim
    fix: With the wheel below center, a new pitch bend range bends up. This is a bug.
  - section: What is unique
    quote: 'CC 65 off writes a byte into the score: a bug.'
    rule: one-claim
    fix: CC 65 off writes a byte into the score. This is a bug.
