# Source of docs/glossary.md. Edit here, then run tools/glossary.py --write.
# Tools read sections by `key`. Entries are term: meaning, in Markdown.
title: Glossary
intro: One line per term. Every acronym used in this repo must appear here.
sections:

  - key: hardware
    title: Amiga hardware
    columns: [Term, Meaning]
    entries:
      ADKCON: Paula control register. Selects attach modes, among other things.
      attach mode: 'One channel''s words set the next channel''s volume or period. HRM: the first is silent.'
      audio filter: Amiga's low-pass filter on all channels. Software can switch it on or off.
      audio interrupt: Paula's signal to the CPU that a channel started a new pass over its sample.
      AUDxLC: Channel x sample start address. Copied to the live pointer at each reload.
      AUDxDAT: Channel x data register. With DMA off, the CPU writes the next word here.
      AUDxLEN: Channel x sample length, in words.
      AUDxPER: 'Channel x period: clock divider that sets pitch.'
      AUDxVOL: Channel x volume, 0 to 64.
      CCK: Colour clock, 3.546895 MHz on PAL. Paula's time unit.
      CIA: Timer chip. Replayers use it for tempo independent of the display.
      CPU: The Motorola 68000 family processor.
      DMA: Direct memory access. Paula fetches samples without the CPU.
      PAL: European TV standard. Sets the Amiga clock and 50 Hz frame rate.
      PWM: Pulse-width modulation. Paula uses it to apply volume. Not the same as pulse width.
      RAM: Random-access memory. The CPU reads and writes it.
      VBL: Vertical blank interrupt, once per frame. The usual replayer tick.
      HRM: Commodore's Amiga Hardware Reference Manual.
      INTREQ: Paula register of pending interrupts, one bit per source. The CPU clears them.
      channel: One of Paula's four hardware sound outputs. Usually plays one voice; mixing can add more.
      period: Paula's pitch value. Higher period, lower pitch.

  - key: computers
    title: Other computers
    columns: [Term, Meaning]
    entries:
      C64: 'Commodore 64: 8-bit home computer with the SID sound chip.'
      ST: 'Atari ST: home computer with a YM2149 sound chip.'

  - key: sound
    title: Sound and synthesis
    columns: [Term, Meaning]
    entries:
      sample: Recorded sound data, played from memory.
      waveform: A short sample loop, often built or changed by code.
      PCM: 'Sampled sound: a stream of stored amplitude values.'
      ADSR: 'Attack, decay, sustain, release: the four phases of a volume envelope.'
      LFO: 'Low-frequency oscillator: slow periodic change, e.g. vibrato.'
      MIDI: Standard protocol for sending notes to synthesizers.
      note-on: The event that starts a note. A MIDI term.
      note-off: The event that ends a note, e.g. to start its release. A MIDI term.
      synth: Sound made by code from short waveforms, not from recordings.
      envelope: A curve that changes volume, or another value, during a note.
      volume list: A command list whose values set a voice's volume.
      wave list: A command list whose values pick a voice's waveform.
      pitch list: A command list whose values set a voice's pitch, often also its waveform.
      modulation: One signal changing a setting of another, e.g. volume or pitch.
      pulse width: The share of a square-like wave's cycle spent high.
      low-pass filter: Removes high frequencies. The sound gets duller.
      high-pass filter: Removes low frequencies. The sound gets thinner.
      note cut: Ending a note at a set tick, before the next note.
      mixing: Adding several voices into one channel's sample data, in software.
      mix rate: Bytes per second that a mixer writes; the channel plays them at this rate.
      resampling: Reading a sample at another rate, by skipping or repeating bytes. It changes pitch.
      hard sync: A wave restarts at each cycle of another. Its rate changes timbre, not pitch.
      slew limiter: Limits each sample's move from the last. It rounds sharp edges.

  - key: music
    title: Music theory
    columns: [Term, Meaning]
    entries:
      note: A pitch with a duration.
      transpose: Shift all pitches by the same interval.
      arpeggio: Fast cycle of note offsets, making a chord-like sound.
      portamento: Slide of the pitch, often towards a target note.
      vibrato: Periodic pitch change.
      trill: Fast alternation between a note and a note above it.
      voice: One independent part of the music.

  - key: changes
    title: Sound changes
    intro: What an operation does to a sound. The "(inference)" notes use these words.
    columns: [Term, Meaning]
    entries:
      timbre: The colour of a sound, apart from pitch and volume.
      clipping: Cutting values that exceed the allowed range.
      detune: A slight shift away from the intended pitch.
      phasing: A sweeping, hollow tone from mixing a sound with a shifted copy.
      crossfade: A gradual blend from one sound into another.
      morph: A gradual change from one waveform into another.

  - key: tracker
    title: Tracker terms
    columns: [Term, Meaning]
    entries:
      tick: One run of the replayer, usually once per frame.
      row: One line of a pattern. It lasts `speed` ticks.
      speed: Ticks per row.
      track: One column of note data, often one per voice.
      pattern: A block of rows, played by one or more tracks.
      position: 'One entry of the song''s play order: patterns to play.'
      section: One entry of a higher play order. It names a list of positions.
      subsong: A separate tune inside one module.
      instrument: 'What a note plays: sample or waveform, plus settings.'
      instrument transpose: Offset added to every instrument number of a track.
      sound effect: A sound the game starts, outside the music.
      command: A code in a row that acts on playback, with an argument, e.g. a slide.

  - key: midi
    title: MIDI and sequencers
    intro: Standard MIDI terms. Note-on and note-off are under Sound and synthesis.
    columns: [Term, Meaning]
    entries:
      SMF: 'Standard MIDI File: a header chunk `MThd`, then one `MTrk` chunk per track.'
      MIDI channel: One of 16 logical channels in a MIDI stream. Not a Paula channel.
      velocity: How hard a note is struck, 0 to 127. Players often map it to volume.
      program change: A MIDI event that picks the instrument of a MIDI channel.
      pitch bend: A MIDI event that shifts the pitch of a whole MIDI channel.
      CC: 'Control change: a MIDI event that sets a MIDI channel parameter by number.'
      CC 1: Modulation wheel.
      CC 5: Portamento time.
      CC 6: Data entry. Sets the parameter that an RPN picks.
      CC 7: Channel volume.
      CC 10: Pan.
      CC 64: 'Damper pedal: while it is down, note-offs are held back.'
      CC 65: Portamento on or off.
      CC 80–83: General-purpose switches. A player gives them its own meaning.
      CC 100, 101: Pick an RPN.
      CC 120: All sound off, at once, without release.
      CC 121: Reset all controllers.
      CC 123: All notes off.
      CC 126: Mono mode on.
      CC 127: Poly mode on.
      mono mode: One note at a time per MIDI channel; a new note replaces it.
      poly mode: Several notes at a time per MIDI channel.
      RPN: 'Registered parameter number: a MIDI channel parameter set through CCs, e.g. the pitch bend range.'
      meta event: An SMF event for the player, not for instruments, e.g. tempo.
      sysex: 'System exclusive: a MIDI message for one maker''s device.'
      running status: A MIDI stream may leave out a status byte that repeats.
      delta time: The wait before an event, in pulses.
      gate time: How long a note stays on before its release.
      pulse: The time unit of a MIDI sequencer, a fraction of a quarter note.
      PPQ: 'Pulses per quarter note: the time resolution of an SMF.'
      tempo: Beats per minute; in an SMF, microseconds per quarter note.
      voice allocation: Choosing a voice for a note at note-on.
      voice stealing: Taking a busy voice for a new note when none is free.
      multisample: An instrument with several samples, each for a range of notes.

  - key: programming
    title: Programming
    intro: Code patterns we cite from replayer source.
    columns: [Term, Meaning]
    entries:
      busy-wait: Waiting in a loop that checks a condition, doing nothing else.
      jump table: A table of code addresses. A number picks which code runs.
      handler: The code that runs for one command or event.
      opcode: A byte that names an action, e.g. a jump, instead of a value.

  - key: programs
    title: Programs and formats
    columns: [Term, Meaning]
    entries:
      AHX: 'Abyss Highest eXperience: Amiga chiptune tracker, 1990s.'
      MED: Music editor by Teijo Kinnunen, later OctaMED. Tracker with synth sounds.
      TFMX: The Final Musicsystem eXtended, by Chris Hülsbeck. Each instrument is a program of opcodes.
      IMS: "TFMX's interference modulation synthesis: a wave rebuilt each tick from a resampled source."
      SMUS: 'Simple Music Score: note score format from Electronic Arts.'
      YAML: Plain-text data format. Our hand-written data files use it.
      UADE: Unix Amiga Delitracker Emulator. Plays Amiga music on other systems.
      audio.device: AmigaOS's Paula driver. Programs queue sample requests to it.
      IFF: 'Interchange File Format by Electronic Arts. 8SVX is its sample type.'
      IRA: Portable 68000 reassembler. Turns a player binary into assembler source.
      vlink: Portable linker by Frank Wille. Links object files into executables.
      vasm: Portable assembler by Volker Barthelmann and Frank Wille.
      EG: SoundMon's envelope generator. It sweeps a wave shape, not the volume.
      MOD: 'SoundMon''s modulation walker: writes one table value into the wave.'

  - key: project
    title: This project
    columns: [Term, Meaning]
    entries:
      C1: Advanced level of the CEFR language scale. Our target reader.
      FK: 'Flesch-Kincaid grade: a readability score. Lower is easier.'

  - key: card
    title: Card terms
    columns: [Term, Meaning]
    entries:
      stream: A position in some data that the player steps through.
      scope: 'Where a stream''s position lives: song, track, voice or instrument.'
      generator: 'Template 1: stateful process that is not a stream, e.g. a vibrato state machine.'
      controller: 'Template 2: any process that writes a channel output.'
      spec: 'A player''s model as typed Python in `specs/`. Its CamelCase names are replay labels.'
      lifecycle event: 'A point in a note''s life: note-on, legato, release, hard stop, program end.'
      interaction: One stream acting on another, e.g. a jump or a trigger.
      sequencer: The streams that decide which note plays and when.
      instrument program: A stream that a note-on starts or restarts. It shapes that note.
      write mode: How a writer changes a channel output, e.g. set or add.
      table walker: 'A stream that steps through a table: off, once or looping.'
      tables: 'Template 1 control level: data walked in order, no opcodes.'
      commands: 'Template 1 control level: data with opcodes, but no conditions.'
      program: 'Template 1 control level: opcodes with conditions or calls.'
      none: 'Template 1 control level: no stream in this role.'
      module: Replay code ships inside the music file.
      delta card: A card with `base`. It shows only what differs from the base card.

  - key: provenance
    title: Provenance
    intro: Where the replay code we read comes from. Set per player in `data/players.yaml`.
    columns: [Value, Meaning]
    entries:
      original: The author's own source, e.g. with the author's copyright.
      disassembly: A disassembly by someone else, e.g. Wanted Team.
      port: A rewrite of the replayer in another language, e.g. C.
      ira: Our own IRA disassembly of a player binary.

  - key: lineage_evidence
    title: Lineage evidence
    intro: How we know that one player grew from another.
    columns: [Value, Meaning]
    entries:
      code: We compared the replay code of both versions.
      port: One port plays both versions with one player.
      docs: The author or another first-hand page says so.
      name: Only the player names match. Not compared yet.

  - key: stream_names
    title: Stream names
    intro: The first word of each name in a card's Streams table. Add a word here before using it, e.g. "Pitch" for "Pitch list".
    columns: [Word, Stream]
    entries:
      Positions: The song's play order.
      Pattern: Rows of notes, one column per voice.
      Track: One column of note data.
      Volume: Volume values or an envelope.
      Pitch: Note offsets or pitch values.
      Wave: Waveform changes.
      Arpeggio: Arpeggio offsets.
      Vibrato: Vibrato offsets.
      ADSR: Volume envelope table.
      LFO: Periodic pitch offsets from a table.
      EG: SoundMon's wave shape sweep.
      MOD: SoundMon's wave sample writes.
      Macro: A program of opcodes that plays a sound.
      Score: One event list for the whole song, in time order.
      Performance: "AHX's instrument list: wave, note and two commands per step."

  - key: avoid
    title: Avoided terms
    intro: Other names for terms above. Checked outside code quotes, so a format's own term can still appear as `code`.
    columns: [Avoid, Use]
    bold: false
    entries:
      sequence: positions
      order list: positions
      block: pattern
      song entry: position
      song step: position
      step list: positions
      subtune: subsong
      macro: instrument program
      frequency sequence: pitch list
      sound number: instrument number
      sound record: instrument
      sound transpose: instrument transpose
      hybrid: synth sound with a sample
      option: command
      hard cut: note cut

  - key: control
    title: Control vocabulary
    intro: Words used in the Control column of player cards.
    columns: [Word, Meaning]
    entries:
      loop: Go back to a loop point.
      jump: Go to another position or another stream.
      call: Jump, then return.
      wait: Pause for N ticks, or until an event such as note-off.
      cond: Branch on a condition.
      end: Stop the stream.
      mode: Off, play once, or loop.
      none: No flow control.

  - key: rate
    title: Advances by vocabulary
    intro: What moves a stream or controller on. Template 1 calls this column Rate.
    columns: [Word, Meaning]
    entries:
      tick: Steps every tick.
      every N ticks: N is a parameter.
      row: Steps every row.
      pattern end: Steps when a pattern ends.
      note end: Steps when the current note's length runs out.
      note-on: Acts once per note, at or just after its start.
      sample wrap: Steps each time Paula finishes a pass of the sample.
      list visit: Steps each time the list that drives it runs.
      delta: Steps when the wait before the next event runs out.

  - key: seq_time
    title: 'Sequencer: time'
    intro: Words for the Time row of a card's Sequencer table. How the score places events in time.
    columns: [Word, Meaning]
    entries:
      rows: A fixed grid. Every row lasts the same time.
      lengths: Each note carries its length; the next event follows it.
      deltas: Each event carries the wait before the next one.
      times: Each event carries its start time.

  - key: seq_unit
    title: 'Sequencer: unit'
    intro: Words for the Unit row. The unit of lengths, deltas or times.
    columns: [Word, Meaning]
    entries:
      tick: One replayer tick.
      row: One row, `speed` ticks long.
      pulse: A fraction of a beat. The tempo sets its length.
      ms: A millisecond.

  - key: seq_note_end
    title: 'Sequencer: note end'
    intro: Words for the Note end row. What ends a note.
    columns: [Word, Meaning]
    entries:
      next note: The next note on the same voice.
      length: The length that the note carries.
      note-off: A separate note-off event.
      program: The instrument program.
      loop count: The sample plays its loop N times, then stops.

  - key: seq_routing
    title: 'Sequencer: routing'
    intro: Words for the Routing row. How a note finds its voice.
    columns: [Word, Meaning]
    entries:
      fixed: A track always plays on the same voice.
      per note: Each note names its voice.
      allocated: The player picks a voice at note-on; see voice allocation.

  - key: seq_reuse
    title: 'Sequencer: reuse'
    intro: Words for the Reuse row. How the score repeats material.
    columns: [Word, Meaning]
    entries:
      patterns: Positions play stored blocks again.
      calls: A stream calls a part of itself or another stream, then returns.
      loops: A stream repeats a part N times.
      none: The score repeats nothing; it is written out.

  - key: seq_tempo
    title: 'Sequencer: tempo'
    intro: Words for the Tempo row. How the score sets its speed.
    columns: [Word, Meaning]
    entries:
      speed: The score sets ticks per row.
      timer: The score sets the tick rate.
      scaled: Each tick adds a tempo-dependent amount to the score clock.
      none: The score cannot change its speed.

  - key: roles
    title: Role vocabulary
    intro: Words used in the Role column of a card's Streams table.
    columns: [Word, Meaning]
    entries:
      sequencer: Decides which note plays and when.
      instrument: Shapes one note. A note-on starts or restarts it.

  - key: outputs
    title: Channel outputs
    intro: What a card's Channel outputs table lists, one row each.
    columns: [Output, Meaning]
    entries:
      Volume: The channel volume.
      Period: The channel period.
      Sample: Sample start and length.
      Wave data: Sample bytes that code rewrites.
      DMA: The channel's DMA on or off.

  - key: write_modes
    title: Write modes
    intro: How a writer in the Channel outputs table changes its output.
    columns: [Mode, Meaning]
    entries:
      set: Replaces the value.
      add: Adds to the value; may be negative.
      scale: Multiplies the value.
      note: Sets the note index. The period comes from the table.
      edit: Rewrites wave data in place.
      'on': Turns DMA on.
      'off': Turns DMA off.

  - key: note_on
    title: Note-on vocabulary
    intro: What a note-on does to a generator. Used in the Generators table.
    columns: [Word, Meaning]
    entries:
      restart: The state starts again.
      keep: The state carries on.
      flag: A parameter chooses restart or keep.
      program: The instrument program clears or starts it.

  - key: ends
    title: Interaction ends
    intro: From and To words in the Interactions table, beside the card's own names.
    columns: [Word, Meaning]
    entries:
      game: The game code that runs the player.
      other voice: A voice other than the one that acts.
      other track: A track other than the one that acts.

  - key: kind
    title: Controller kinds
    intro: Words for the Kind column in a card's Sound tables.
    columns: [Word, Meaning]
    entries:
      program: Opcodes with conditions or calls.
      command list: Opcodes with jumps and waits, but no conditions or calls.
      table walker: 'Steps through a table: off, once or looping.'
      state machine: Changes its state by rules, e.g. an envelope or a vibrato.
      lookup: Maps an input to a value. It has no state of its own.

  - key: owner
    title: Owners
    intro: 'Words for the Owner column in Sound: whose data a controller keeps or edits.'
    columns: [Word, Meaning]
    entries:
      voice: Each voice has its own copy.
      instrument: All voices that play the instrument share it.
      song: One copy serves all voices.

  - key: lifecycle
    title: Lifecycle events
    intro: Events the lifecycle handlers in a card's Timing section cover.
    columns: [Word, Meaning]
    entries:
      note-on: A new note starts on the voice.
      legato: A new note starts, but the channel keeps playing.
      release: The note enters its last phase and can still sound.
      hard stop: The note stops at once.
      program end: The instrument program ends; the note may sound on.
